name: terraform

# Pipeline dell'infrastruttura, separata da quella applicativa (deploy.yml): una modifica
# al codice non richiede di rieseguire un piano Terraform, e viceversa.
#
# RESOURCE_PREFIX (variabile del repository, opzionale): se valorizzato il progetto GCP è
# condiviso e tutte le risorse (incluso il bucket di state) portano questo prefisso.
#
# Avvio manuale; apply aspetta un'approvazione manuale su una issue GitHub prima di
# applicare esattamente il piano già revisionato.
#
# Le variabili del repository vengono "normalizzate" all'inizio di ogni job: spazi e a capo
# finali (facili da introdurre incollando il valore su GitHub) vengono rimossi, e da lì in
# poi si usano le variabili di shell $PROJECT_ID, $REGION, $RESOURCE_PREFIX e $STATE_BUCKET.

on:
  workflow_dispatch: {}

permissions:
  contents: read

defaults:
  run:
    working-directory: devops/cloud

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizza variabili
        env:
          RAW_PROJECT_ID: ${{ vars.PROJECT_ID }}
          RAW_REGION: ${{ vars.REGION }}
          RAW_RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
        run: |
          PROJECT_ID="$(printf '%s' "$RAW_PROJECT_ID" | tr -d '[:space:]')"
          REGION="$(printf '%s' "$RAW_REGION" | tr -d '[:space:]')"
          RESOURCE_PREFIX="$(printf '%s' "$RAW_RESOURCE_PREFIX" | tr -d '[:space:]')"
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "REGION=$REGION"
            echo "RESOURCE_PREFIX=$RESOURCE_PREFIX"
            echo "STATE_BUCKET=${RESOURCE_PREFIX:-$PROJECT_ID}-tfstate"
          } >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Assicura che il bucket dello state esista
        run: |
          gcloud storage buckets describe "gs://$STATE_BUCKET" \
            --project "$PROJECT_ID" >/dev/null 2>&1 || \
          gcloud storage buckets create "gs://$STATE_BUCKET" \
            --project "$PROJECT_ID" \
            --location "$REGION" \
            --uniform-bucket-level-access

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=sage"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -var "project_id=$PROJECT_ID" \
            -var "region=$REGION" \
            -var "resource_prefix=$RESOURCE_PREFIX" \
            -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: devops/cloud/tfplan
          retention-days: 1

  approval:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: trstringer/manual-approval@v1
        with:
          secret: ${{ secrets.GITHUB_TOKEN }}
          approvers: ${{ vars.APPROVERS }}
          minimum-approvals: 1
          issue-title: "Approvazione terraform apply — Sage (run ${{ github.run_id }})"

  apply:
    needs: approval
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalizza variabili
        env:
          RAW_PROJECT_ID: ${{ vars.PROJECT_ID }}
          RAW_RESOURCE_PREFIX: ${{ vars.RESOURCE_PREFIX }}
        run: |
          PROJECT_ID="$(printf '%s' "$RAW_PROJECT_ID" | tr -d '[:space:]')"
          RESOURCE_PREFIX="$(printf '%s' "$RAW_RESOURCE_PREFIX" | tr -d '[:space:]')"
          {
            echo "PROJECT_ID=$PROJECT_ID"
            echo "STATE_BUCKET=${RESOURCE_PREFIX:-$PROJECT_ID}-tfstate"
          } >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=sage"

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: devops/cloud

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

